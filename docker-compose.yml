# PGAIO — Docker Compose (Development/Testing)
# Includes MinIO for S3-compatible storage testing

services:
  pgaio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgaio
    ports:
      - "8080:8080" # Web UI
    environment:
      # PostgreSQL
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=postgres
      # WAL-G + S3
      - WALG_S3_PREFIX=s3://pgaio-backups/wal-g
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT=http://minio:9000
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_REGION=us-east-1
      # Backup schedule
      - BACKUP_INTERVAL_HOURS=6
      - BACKUP_RETAIN_COUNT=7
      # Backup encryption (optional — generate with: openssl rand -hex 32)
      # - WALG_LIBSODIUM_KEY=
    volumes:
      - pgdata:/bitnami/postgresql
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    container_name: pgaio-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    container_name: pgaio-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/pgaio-backups;
      echo 'Bucket created successfully';
      "

volumes:
  pgdata:
  minio-data:
