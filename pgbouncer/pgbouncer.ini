[databases]
* = host=/tmp port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; Pool settings
pool_mode = transaction
; Recommended compatibility list for transaction pooling when clients insist on
; startup/session parameters. Keep real statement_timeout enforcement in PostgreSQL
; via ALTER ROLE / ALTER DATABASE, because ignored startup parameters are not applied.
ignore_startup_parameters = extra_float_digits,options,statement_timeout,lock_timeout,idle_in_transaction_session_timeout
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 1000
max_db_connections = 50

; Admin
admin_users = pgbouncer,postgres
stats_users = pgbouncer,postgres

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; Timeouts
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120

; Low-level
pkt_buf = 4096
listen_backlog = 128
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3

; PID and socket
pidfile = /tmp/pgbouncer.pid
unix_socket_dir = /tmp
